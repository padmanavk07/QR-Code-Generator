<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1>QR Code Generator</h1>
            <p>Generate instant QR codes for text, URLs, and more.</p>
        </header>

        <main class="app-main">
            <section class="input-section">
                <div class="mode-tabs">
                    <button type="button" class="tab-btn active" data-mode="text">Text</button>
                    <button type="button" class="tab-btn" data-mode="url">URL</button>
                </div>

                <form id="qr-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label id="input-label" for="qr-input">Enter Text</label>
                        <input 
                            type="text" 
                            id="qr-input" 
                            placeholder="Type something here..." 
                            required
                        >
                        <span id="error-message" class="error-text hidden"></span>
                    </div>
                    <button type="submit" id="generate-btn">Generate QR Code</button>
                </form>
            </section>

            <!-- QR Code Display Area -->
            <section class="display-section">
                <div class="display-wrap">
                    <div id="qrcode-container">
                        <div class="placeholder-text">Your QR Code will appear here</div>
                    </div>
                    <button type="button" id="download-btn" class="hidden">Download PNG</button>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>&copy; Padmanav Khamari. All rights reserved.</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
